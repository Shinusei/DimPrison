name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        run: ./gradlew --build-cache clean assemble

      - name: Name release artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar')
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one distributable jar, found ${#jars[@]}." >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" "build/libs/DimPrison-${GITHUB_REF_NAME}.jar"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DimPrison ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: build/libs/DimPrison-${{ github.ref_name }}.jar
